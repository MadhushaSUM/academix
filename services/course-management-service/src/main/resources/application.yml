server:
  port: 8080

spring:
  application:
    name: course-management-service
  cloud:
    consul:
      host: consul-server # Point to the Consul service in docker-compose
      port: 8500
      discovery:
        prefer-ip-address: true # Recommended for Docker environments
        health-check-path: /actuator/health # Consul will use this for health checks
        health-check-interval: 10s # How often Consul checks health
        instance-id: ${spring.application.name}:${random.value} # Unique ID for each instance

  # JPA (Hibernate) configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate: INFO
    org.springframework.cloud.netflix: DEBUG
    com.academix: DEBUG
