server:
  port: 8080
  ssl:
    enabled: true
    key-store: /certs/user-management-service.p12
    key-store-password: ${KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    trust-store: /certs/truststore.p12
    trust-store-password: ${TRUSTSTORE_PASSWORD:changeit}
    client-auth: need  # Require client certificates for mTLS

spring:
  application:
    name: user-management-service

  datasource:
    url: jdbc:postgresql://postgresql-user:5432/academix_users_db
    username: academix_user
    password: academix_password
    driver-class-name: org.postgresql.Driver

  cloud:
    consul:
      host: consul-server # Point to the Consul service in docker-compose
      port: 8500
      discovery:
        service-name: ${spring.application.name}
        instance-id: ${spring.application.name}:${random.value}
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 10s

  # JPA (Hibernate) configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt:
  # IMPORTANT: Replace this with a strong, random, base64-encoded key.
  # This key should be at least 256 bits (32 bytes) for HS256.
  secret: WU9VUl9TVVBFUl9TRUNSRVRfSldUX0tFWV9USEFUX0lTX0FUX0xFQVNUXzI1Nl9CSVRTX0xPTkdfQU5EX0JBU0U2NF9FTkNPREVE
  expiration:
    ms: 86400000 # 24 hours in milliseconds (24 * 60 * 60 * 1000)

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate: INFO
    org.springframework.cloud.netflix: DEBUG
    com.academix: DEBUG
