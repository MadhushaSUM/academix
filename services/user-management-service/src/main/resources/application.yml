server:
  port: 8080
  ssl:
    enabled: true
    key-store: file:/app/certs/user-management-service.jks # Changed to file: path
    key-store-type: JKS
    key-store-password: changeit # Keystore password (CHANGE THIS!)
    key-password: changeit # Key password (CHANGE THIS!)
    trust-store: file:/app/certs/user-management-service-truststore.jks # Changed to file: path
    trust-store-type: JKS
    trust-store-password: changeit # Truststore password (CHANGE THIS!)
    client-auth: NEED # Require client certificate for mTLS from API Gateway

spring:
  application:
    name: user-management-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgresql-user:5432/academix_users_db}
    username: ${SPRING_DATASOURCE_USERNAME:academix_user}
    password: ${SPRING_DATASOURCE_PASSWORD:academix_password}
    driver-class-name: org.postgresql.Driver

  # JPA (Hibernate) configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-server:8761/eureka}
  instance:
    hostname: user-management-service # Use the Docker Compose service name for registration
    prefer-ip-address: true # Prefer IP address for registration (useful in Docker)
    # Important: Register with secure port for internal communication
    secure-port: ${server.port}
    secure-port-enabled: true
    status-page-url: https://${eureka.instance.hostname}:${server.port}/actuator/info
    health-check-url: https://${eureka.instance.hostname}:${server.port}/actuator/health
    home-page-url: https://${eureka.instance.hostname}:${server.port}/

# JWT Configuration
jwt:
  # IMPORTANT: Replace this with a strong, random, base64-encoded key.
  # This key should be at least 256 bits (32 bytes) for HS256.
  secret: WU9VUl9TVVBFUl9TRUNSRVRfSldUX0tFWV9USEFUX0lTX0FUX0xFQVNUXzI1Nl9CSVRTX0xPTkdfQU5EX0JBU0U2NF9FTkNPREVE
  expiration:
    ms: 86400000 # 24 hours in milliseconds (24 * 60 * 60 * 1000)

# Actuator configuration for health checks and monitoring
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# Logging configuration
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate: INFO
    org.springframework.cloud.netflix: DEBUG
    com.academix: DEBUG
