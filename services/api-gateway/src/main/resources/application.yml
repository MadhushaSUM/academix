server:
  port: 8080
  ssl:
    enabled: true
    key-store: file:/app/certs/api-gateway.jks # Changed to file: path
    key-store-password: changeit # Keystore password (CHANGE THIS!)
    key-password: changeit # Key password (CHANGE THIS!)
    trust-store: file:/app/certs/api-gateway-truststore.jks # Changed to file: path
    trust-store-password: changeit # Truststore password (CHANGE THIS!)
    client-auth: none


spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Route for User Management Service
        - id: user-management-service-route
          uri: lb://user-management-service # 'lb' for load-balancing via Eureka
          predicates:
            - Path=/api/v1/users/**, /api/v1/auth/**
          filters:
            - StripPrefix=2 # Removes /api/v1 from the path before forwarding

        # Route for Course Management Service
        - id: course-management-service-route
          uri: lb://course-management-service
          predicates:
            - Path=/api/v1/courses/**
          filters:
            - StripPrefix=2 # Removes /api/v1 from the path before forwarding

  main:
    web-application-type: reactive

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-server:8761/eureka}
  instance:
    hostname: api-gateway
    prefer-ip-address: true
    # Important: Register with secure port for internal communication
    secure-port: ${server.port}
    secure-port-enabled: true
    status-page-url: https://${eureka.instance.hostname}:${server.port}/actuator/info
    health-check-url: https://${eureka.instance.hostname}:${server.port}/actuator/health
    home-page-url: https://${eureka.instance.hostname}:${server.port}/

# JWT Configuration
jwt:
  # IMPORTANT: Replace this with a strong, random, base64-encoded key.
  # This key should be at least 256 bits (32 bytes) for HS256.
  secret: WU9VUl9TVVBFUl9TRUNSRVRfSldUX0tFWV9USEFUX0lTX0FUX0xFQVNUXzI1Nl9CSVRTX0xPTkdfQU5EX0JBU0U2NF9FTkNPREVE
  expiration:
    ms: 86400000

# Actuator configuration for health checks and monitoring
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# Logging configuration
logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.netflix: DEBUG
    com.academix: DEBUG
