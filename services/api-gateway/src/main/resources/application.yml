server:
  port: 8443
  ssl:
    enabled: true
    key-store: /certs/api-gateway.p12
    key-store-password: ${KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    trust-store: /certs/truststore.p12
    trust-store-password: ${TRUSTSTORE_PASSWORD:changeit}
    client-auth: want  # Allow but don't require client certificates (external clients)


spring:
  application:
    name: api-gateway

  cloud:
    consul:
      host: consul-server # Point to the Consul service in docker-compose
      port: 8500
      discovery:
        service-name: ${spring.application.name}
        instance-id: ${spring.application.name}:${random.value}
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 10s

    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        # Route for User Management Service
        - id: user-management-service-route
          uri: http://user-management-service:8080
          predicates:
            - Path=/api/v1/users/**, /api/v1/auth/**
          filters:
            - StripPrefix=2 # Removes /api/v1 from the path before forwarding

        # Route for Course Management Service
        - id: course-management-service-route
          uri: http://course-management-service:8080
          predicates:
            - Path=/api/v1/courses/**
          filters:
            - StripPrefix=2 # Removes /api/v1 from the path before forwarding
      httpclient:
        connect-timeout: 5000
        response-timeout: 10s

  main:
    web-application-type: reactive

# JWT Configuration
jwt:
  # IMPORTANT: Replace this with a strong, random, base64-encoded key.
  # This key should be at least 256 bits (32 bytes) for HS256.
  secret: WU9VUl9TVVBFUl9TRUNSRVRfSldUX0tFWV9USEFUX0lTX0FUX0xFQVNUXzI1Nl9CSVRTX0xPTkdfQU5EX0JBU0U2NF9FTkNPREVE
  expiration:
    ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.netflix: DEBUG
    com.academix: DEBUG
