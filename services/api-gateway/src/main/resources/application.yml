server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    consul:
      host: consul-server # Point to the Consul service in docker-compose
      port: 8500
      discovery:
        prefer-ip-address: true # Recommended for Docker environments
        health-check-path: /actuator/health # Consul will use this for health checks
        health-check-interval: 10s # How often Consul checks health
        instance-id: ${spring.application.name}:${random.value} # Unique ID for each instance
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Route for User Management Service
        - id: user-management-service-route
          uri: lb://user-management-service # 'lb' for load-balancing via Eureka
          predicates:
            - Path=/api/v1/users/**, /api/v1/auth/**
          filters:
            - StripPrefix=2 # Removes /api/v1 from the path before forwarding

        # Route for Course Management Service
        - id: course-management-service-route
          uri: lb://course-management-service
          predicates:
            - Path=/api/v1/courses/**
          filters:
            - StripPrefix=2 # Removes /api/v1 from the path before forwarding

  main:
    web-application-type: reactive

# JWT Configuration
jwt:
  # IMPORTANT: Replace this with a strong, random, base64-encoded key.
  # This key should be at least 256 bits (32 bytes) for HS256.
  secret: WU9VUl9TVVBFUl9TRUNSRVRfSldUX0tFWV9USEFUX0lTX0FUX0xFQVNUXzI1Nl9CSVRTX0xPTkdfQU5EX0JBU0U2NF9FTkNPREVE
  expiration:
    ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.netflix: DEBUG
    com.academix: DEBUG
